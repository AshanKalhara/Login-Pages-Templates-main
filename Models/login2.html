<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login 2</title>
</head>
<body>
    <main>
        <section class="login-form">
            <h1>Login</h1>
            <form method="POST">
                <div class="input-field">
                    <input type="text" name="username" placeholder="Username" autocomplete="username" required>
                    <br>
                    <input type="password" name="password" placeholder="Password" autocomplete="password" required>
                </div>
                <div class="additional-field">
                    <div class="remember-me">
                        <input type="checkbox" name="remember-me">
                        <label for="remember-me">Remember Me</label>
                    </div>
                    <div class="forgot-password">
                        <a href="#">Forgot Password</a>
                    </div>
                </div>
                    <div class="button-field">
                        <button class="login-btn" type="submit">
                            Login
                        </button>
                        <button class="cancel-btn" type="reset">
                            Cancel
                        </button>
                    </div>
                    <div class="rgform-link">
                        <a href="#">Don't have an account ? Register</a>
                    </div>
                    </form>
                    <div class="image">
                        <img src="/Assets/Doodle.jpg.jpg" alt="doodle art" class="image-login">
                    </div>
        </section>
    </main>
</body>
</html>
