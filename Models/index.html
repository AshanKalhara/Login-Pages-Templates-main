<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page 1</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/Views/stylesheet1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="login-page">
        <section class="login-form">
            <h1>LOGIN</h1>
            <form method="POST">
                <div class="input-field">
                    <input type="text" name="username" id="username" placeholder="Username"required autocomplete>
                        <i class='bx bxs-user'></i>
                </div>
                <div class="input-field">
                    <input type="password" name="password" id="password" placeholder="Password" required autocomplete>
                        <i class='bx bxs-lock-alt'></i>
                </div>
            </form>
                <div class="additional-field">
                    <div class="remember-me">
                        <input type="checkbox" name="rememberme" id="remember">
                        <label for="remember" id="rememberme">Remember me</label>
                    </div>
                    <div class="forgot">
                        <a href="#">Forgot Password?</a>
                    </div>
                </div>
                <div class="button-field">
                    <button class="login-btn" type="submit">
                        Login
                    </button>
                    <button class="cancel-btn" type="reset">
                        Cancel
                    </button>
                </div>
                <div class="register">
                    <a href="#">Don't have an account? Register</a>
                </div>
        </section>
    </main>
</body>
</html>
